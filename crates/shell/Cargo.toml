[package]
name = "cipherlayer-shell"
version = "0.1.0"
description = "CipherLayer Browser MVP shell (Tauri host, ADR-B002/ADR-B003) — presentation only, zero authority"
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dependencies]
broker-core = { path = "../broker-core" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
